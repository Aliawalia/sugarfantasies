<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D1FDFF" />
    <meta name="description" content="resin seeping from a tree named cistus" />
    <meta property="og:title" content="Labdanum" />
    <meta
      property="og:description"
      content="resin seeping from a tree named cistus"
    />
    <meta property="twitter:title" content="Labdanum" />
    <link rel="stylesheet" href="css/current.css" />
    <link href="/css/current.css" rel="stylesheet" type="text/css" media="all" />
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <title>Currently</title>
    <style>
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left">
        <img src="/fun/me.webp" class="me" alt="me" />
        <div class="aa">
          <h1>Me</h1>
          <div class="status">
            <p id="status-details">loading...</p>
            <div id="status-blob"></div>
          </div>
          <p class="current">
            <b> currently</b> :
            <a href="https://www.imood.com/users/aliaa"
              ><img
                src="https://moods.imood.com/display/uname-aliaa/trans-1/imood.gif"
                alt="The current mood of aliaa at www.imood.com"
                style="border: 0px; position: absolute; top: 3px; left: 5em"
            /></a>
            <br />
          </p>
        </div>

        <div class="aa">
          <h1>Website</h1>
          <p>
            <b>last updated</b>: <span id="nc-last-updated">...</span> <br />
            <b>views</b>: <span id="nc-views">...</span> <br />
            <b>hits</b>: <span id="nc-hits">...</span><br />
          </p>
        </div>

        <h2>Top tracks this week</h2>
        <div id="lastfm-top"><div id="listening-to"></div></div>
      </div>

      <div class="right">
        <h1>Drawbox!!</h1>
        <div class="canvas1">
          <canvas id="drawboxcanvas"></canvas>
          <br />
          <fieldset id="controls">
            <label for="colorpicker"><strong>Color Picker: </strong></label>
            <input
              type="color"
              id="colorpicker"
              name="colorpicker"
              value="#000000"
            />
            <output id="colorchoice" for="colorpicker">#000000</output
            ><br /><br />

            <label for="palette"><strong>Color Palette:</strong></label>
            <select id="palette" name="palette">
              <option value="Pastels">Pastels</option>
              <option value="Vibrant">Vibrant</option>
              <option value="Browns">Browns</option>
            </select>
            <div id="palettes"></div>
            <br />

            <label for="Strokewidth"><strong>Stroke Size: </strong></label>
            <input
              class="slider"
              type="range"
              id="Strokewidth"
              name="Strokewidth"
              min="1"
              max="100"
              value="2"
              title="stroke width"
            />
            <output id="StrokeAmount" for="Strokewidth">2</output>
            <br /><br />

            <label for="Opacity"><strong>Opacity: </strong></label>
            <input
              class="slider"
              type="range"
              id="Opacity"
              name="Opacity"
              step="0.05"
              min="0"
              max="1"
              value="1"
              title="Opacity"
            />
            <output id="OpacityAmount" for="Opacity">1.00</output>
            <br /><br />

            <label for="BrushType"><strong>Brush type:</strong></label>
            <select id="BrushType" name="BrushType">
              <option value="round" selected>Round</option>
              <option value="bevel">Bevel</option>
              <option value="miter">Miter</option>
            </select>
            <span> | </span>
            <label for="LineCap"><strong>Line Cap:</strong></label>
            <select id="LineCap" name="LineCap">
              <option value="round" selected>Round</option>
              <option value="butt">Butt</option>
              <option value="square">Square</option>
            </select>
            <br /><br />

            <label for="username"><strong>Your Name:</strong></label>
            <input type="text" id="username" maxlength="30" />
            <br /><br />
            <button id="undo" title="you can also do ctrl+z">Undo</button>
            <button id="clear" title="clear button">Clear</button>
            <button id="submit">Submit drawing</button>
          </fieldset>
          <p id="status"></p>
        </div>

        <h1>Submitted Drawings</h1>
        <div id="gallery">Loading images...</div>
        <br />
      </div>
    </div>

    <script src="/scripts/interesting.js"></script>
    <script src="https://resrc.cock.institute/v1/neocities?site=labdanum&callback=showSiteInfo"></script>

  </body>
</html>
